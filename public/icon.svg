<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="darkChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="speedSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="headlightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Outer Rounded Squircle Base with Gold Edge -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#crestGold)" filter="url(#badgeShadow)"/>
  
  <!-- Deep Metallic Core -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#darkChrome)"/>
  
  <!-- Inner Precision Bevel -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="26.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Precision Aerodynamic Supercar Silhouette -->
  <g transform="translate(4, 8)">
    <!-- Aerodynamic Fastback Roofline & Body Silhouette -->
    <path d="M18 76C24 72 35 71 43 66L56 45C61 38 68 36 80 37H91C97 38 102 43 106 52L112 66C115 72 112 77 106 80C94 84 66 85 18 76Z" fill="url(#crestGold)"/>
    
    <!-- Tinted Cabin Glass Windshield Cut -->
    <path d="M58 48L48 64C56 64.5 68 64 78 63L86 48C82 45.5 70 45 58 48Z" fill="#020617" opacity="0.95"/>
    
    <!-- Aggressive Xenon / LED Headlight Beam -->
    <path d="M16 78L35 73L22 82L16 78Z" fill="#FFFFFF" filter="url(#headlightGlow)"/>
    
    <!-- Muscular Lower Aero Crease / Side Vent -->
    <path d="M43 72L73 69L67 75L40 78L43 72Z" fill="#090E17" opacity="0.85"/>
    
    <!-- High-Speed Lower Ground Effect Splitter -->
    <path d="M14 86C36 88.5 76 89.5 109 83" stroke="url(#crestGold)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Aero Flow Roofline Accent -->
    <path d="M36 34C50 30 72 30 88 31" stroke="url(#speedSilver)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
